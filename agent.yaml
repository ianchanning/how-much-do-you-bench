# Your harness configuration: which agent runs, against which model, with which
# skills, MCP servers and prompt. It is Harbor's own JobConfig, so it is what
# actually runs rather than a translation layer.
#
#   just eval           # run this config against a task
#   just show-config    # print what it resolves to, without running anything
#
# `agents` is a list. A second entry runs both against the same task in one
# command, which is the cheap way to check that your work beats the harness you
# started from.
#
# In a graded run:
#
#   * Only the FIRST entry is graded. List several while you compare, put the
#     one you mean on top before you submit.
#   * `name`, `import_path`, `model_name`, `skills`, `mcp_servers` and `kwargs`
#     are honoured. Anything else (`mounts`, `env`, a task path) is refused.
#   * `skills:` paths are resolved inside your commit, so commit the directory.
#
# A config that breaks those rules is rejected at `just submit`, with the
# reason, and does not spend one of your submissions.
#
# What each harness needs against this model, and which ones cannot reach it at
# all, is in docs/harnesses.md.

agents:
  - name: custom
    import_path: adapter.submission_agent:Submission
    model_name: gemma

  # - name: pi
  #   model_name: gateway/gemma
  #   kwargs:
  #     thinking: high
  #     prompt_template_path: ./skills/pi-prompt.md

  - name: opencode
    # The `gateway` provider is defined under kwargs below. opencode's adapter
    # refuses a model_name with no provider prefix.
    model_name: gateway/gemma
    skills: []
    mcp_servers: []
    kwargs:
      opencode_config:
        # Your system prompt. `build` is the agent `opencode run` uses, and
        # `prompt` replaces opencode's own, so it has to say everything the
        # model needs, not just your additions. Inline text only: opencode
        # resolves `{file:...}` paths inside the task container, and nothing
        # from this repo is there.
        #
        agent:
          build:
            prompt: |
              You are a data engineer working in a Linux container. You have one tool call per turn, so spend them wisely.

              ## Recon first
              Read the instruction file fully. Then read every script, config, or file it references before touching anything. Check docs/ if it exists — specs and codebooks live there.

              ## Use the right tool for the job
              - **DuckDB**: prefer the CLI over Python. `duckdb /path/to/file.duckdb -c 'SELECT ...'` is one turn. Python boilerplate is five.
              - **dbt**: run with `cd /app/pipeline && dbt run --profiles-dir . --quiet` then inspect via the DuckDB CLI.
              - **Shell scripts**: read them before running. They reveal what tools and paths are in play.
              - **Python**: read existing function signatures and return shapes before implementing.
              - **Terraform**: `terraform plan` before `terraform apply`.

              ## Fix discipline
              Read and understand the code fully before making any edits. Form a clear hypothesis about the root cause first. Then make one targeted fix and run the pipeline once to verify. If the first fix is wrong, re-read the code — do not guess and re-run repeatedly.

              ## Done means verified
              Before finishing, run the pipeline or check script from a clean state. Check two things independently: (1) the target has no duplicates, and (2) every row that should be in the target is actually there — cross-check counts against the source. A fix that removes duplicates but silently drops rows is still wrong. Do not declare success until you have confirmed both.

        # A provider id opencode does not recognise gets chat completions,
        # which is the route on which it can see this model's reasoning.
        # `gemma` is not in models.dev, so the capabilities are stated here.
        provider:
          gateway:
            npm: "@ai-sdk/openai-compatible"
            options:
              baseURL: "{env:GATEWAY_URL}"
              apiKey: "{env:GATEWAY_API_KEY}"
            models:
              gemma:
                reasoning: true
                tool_call: true
                interleaved:
                  field: reasoning_content
                limit:
                  context: 262144
                  output: 8192
                options:
                  reasoningEffort: high

  # Your own agent: the `agent/` directory, run as `uv run agent --instruction`.
  #
  # - name: custom
  #   import_path: adapter.submission_agent:Submission
  #   model_name: gemma

  # - name: claude-code
